components:
  schemas:
    ActionEnum:
      enum:
      - OPEN
      - CLOSE
      - DEPOSIT
      - RETRIEVE
      - RECONCILE
      type: string
      description: |-
        * `OPEN` - Open
        * `CLOSE` - Close
        * `DEPOSIT` - Deposit
        * `RETRIEVE` - Retrieve
        * `RECONCILE` - Reconcile
    CreateTransaction:
      type: object
      properties:
        product_id:
          type: integer
          minimum: 1
        quantity:
          type: integer
          minimum: 1
        buyer_full_name:
          type: string
          default: ''
          maxLength: 255
        shipping_address:
          type: string
          default: ''
        buyer_phone_number:
          type: string
          default: ''
          maxLength: 32
      required:
      - product_id
      - quantity
    DecisionEnum:
      enum:
      - retry
      - confirm_failed
      - confirm_completed
      type: string
      description: |-
        * `retry` - Retry
        * `confirm_failed` - Confirm failed
        * `confirm_completed` - Confirm completed
    DeviceRecognitionResponse:
      type: object
      description: 'Device ingest response: one authorization decision per submitted
        image.'
      properties:
        log_id:
          type: string
        status:
          type: string
        confidence:
          type: number
          format: double
          nullable: true
      required:
      - confidence
      - log_id
      - status
    DeviceRecognitionUploadRequest:
      type: object
      description: Schema-only mirror of the device ingest multipart payload (no runtime
        use).
      properties:
        image:
          type: string
          format: uri
          description: Single camera frame to recognize.
      required:
      - image
    FaceAccessLog:
      type: object
      properties:
        log_id:
          type: string
        id_face_user:
          type: string
          nullable: true
        image_url:
          type: string
          nullable: true
        access_time:
          type: string
          format: date-time
        status:
          type: string
      required:
      - access_time
      - id_face_user
      - image_url
      - log_id
      - status
    FaceAccessLogListResponse:
      type: object
      properties:
        status:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/FaceAccessLog'
      required:
      - data
      - status
    FaceDetail:
      type: object
      description: Body shape for DRF ``PermissionDenied``/``Http404`` responses.
      properties:
        detail:
          type: string
      required:
      - detail
    FaceError:
      type: object
      description: 'Body shape for ``Response({''error'': ...})`` responses.'
      properties:
        error:
          type: string
      required:
      - error
    FaceTrainingListResponse:
      type: object
      properties:
        status:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/FaceTrainingRecord'
      required:
      - data
      - status
    FaceTrainingRecord:
      type: object
      properties:
        id:
          type: integer
        image_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - created_at
      - id
      - image_url
      - updated_at
    FaceTrainingRegistrationResponse:
      type: object
      properties:
        status:
