          type: integer
          readOnly: true
        event_id:
          type: string
          format: uuid
          readOnly: true
        command_id:
          type: string
          format: uuid
          readOnly: true
        event_type:
          allOf:
          - $ref: '#/components/schemas/IoTEventEventTypeEnum'
          readOnly: true
        payload:
          readOnly: true
        created_at:
          type: string
          format: date-time
