          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LockerCommandError'
          description: ''
  /api/v1/lockers/inbound/verify-delivery/:
    post:
      operationId: v1_lockers_inbound_verify_delivery_create
      description: Courier verifies an inbound delivery by receipt number and receives
        the queued locker command (MQTT dispatch). Courier-only.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptNumber'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReceiptNumber'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReceiptNumber'
        required: true
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LockerRequest'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LockerCommandError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LockerCommandError'
          description: ''
        '404':
          content:
            application/json:
