      - DEVICE
      - LOCKER_OPENED
      - ITEM_DETECTED
      - ITEM_REMOVED
      - COMMAND_FAILED
      type: string
      description: |-
        * `GENERIC` - Generic
        * `DEVICE` - Device event
        * `LOCKER_OPENED` - Locker opened
        * `ITEM_DETECTED` - Item detected
        * `ITEM_REMOVED` - Item removed
        * `COMMAND_FAILED` - Command failed
