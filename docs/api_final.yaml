      parameters:
      - in: path
        name: delivery_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LockerRequest'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LockerCommandError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LockerCommandError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LockerCommandError'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LockerCommandError'
          description: ''
  /api/v1/lockers/inbound/{delivery_id}/store/:
    post:
      operationId: v1_lockers_inbound_store_create
      description: Courier stores an inbound delivery in its assigned storage locker;
