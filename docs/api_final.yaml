openapi: 3.0.3
info:
  title: SmartLocker API
  version: 2.0.0
  description: API schema for SmartLocker backend integration.
paths:
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/facerecognition/access-logs/{log_id}/image/:
    get:
      operationId: v1_facerecognition_access_logs_image_retrieve
      description: 'Stream a private face access-log image. Owner-only (or staff);
        unknown-face logs are staff-only. Served with Cache-Control: private, no-store.'
      parameters:
      - in: path
        name: log_id
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            image/*:
              schema:
                type: string
                format: binary
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceDetail'
          description: ''
  /api/v1/facerecognition/createimagetrainingusernew/:
    post:
      operationId: v1_facerecognition_createimagetrainingusernew_create
      description: Register 1-10 face training images for an owner account and rebuild
        the private recognition model. Owner-only; staff may target another owner
        via the username field.
      tags:
      - v1
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FaceTrainingUploadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FaceTrainingUploadRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceTrainingRegistrationResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceDetail'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceError'
          description: ''
  /api/v1/facerecognition/createlogusersmartnew/:
    post:
      operationId: v1_facerecognition_createlogusersmartnew_create
      description: Device face-recognition ingest. Requires the X-Device-Token header
        (403 device_auth_failed otherwise). Returns the authorization decision and
        access-log id for the submitted camera frame.
      parameters:
      - in: header
        name: X-Device-Token
        schema:
          type: string
        description: Shared device credential; a missing/incorrect value yields 403
          device_auth_failed.
        required: true
      tags:
      - v1
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeviceRecognitionUploadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceRecognitionUploadRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRecognitionResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceDetail'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceError'
          description: ''
  /api/v1/facerecognition/getuserimageexists/:
    get:
      operationId: v1_facerecognition_getuserimageexists_retrieve
      description: List the registered face training images for an owner account.
      parameters:
      - in: query
        name: username
        schema:
          type: string
        description: Owner username to inspect; staff may target another owner.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceTrainingListResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/facerecognition/getuserlogsmartnew/:
    get:
      operationId: v1_facerecognition_getuserlogsmartnew_retrieve
      description: List face access logs for an owner account.
      parameters:
      - in: query
        name: username
        schema:
          type: string
        description: Owner username to inspect; staff may target another owner.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceAccessLogListResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceDetail'
          description: ''
  /api/v1/facerecognition/training-images/{id}/:
    get:
      operationId: v1_facerecognition_training_images_retrieve
      description: 'Stream a private face-training image. Owner-only (or staff); served
        with Cache-Control: private, no-store and no public storage URL.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            image/*:
              schema:
                type: string
                format: binary
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceDetail'
          description: ''
    delete:
      operationId: v1_facerecognition_training_images_destroy
      description: Delete a private face-training image and rebuild the recognition
        model. Owner-only (or staff).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceDetail'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceError'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceError'
          description: ''
  /api/v1/iot/events/:
    post:
      operationId: v1_iot_events_create
      description: Device event ingest. Requires the X-Device-Token header. Idempotent
        by event_id; a late event past expiry returns 409 with reconciliation_required.
      parameters:
      - in: header
        name: X-Device-Token
        schema:
          type: string
        description: Shared device credential; a missing/incorrect value yields 403
          device_auth_failed.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IoTIngest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IoTIngest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IoTIngest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoTEvent'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoTEvent'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoTDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoTError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
