          $ref: '#/components/schemas/IoTIngestEventTypeEnum'
        payload: {}
      required:
      - command_id
      - event_id
      - event_type
    IoTIngestEventTypeEnum:
      enum:
      - LOCKER_OPENED
      - ITEM_DETECTED
      - ITEM_REMOVED
      - COMMAND_FAILED
      type: string
      description: |-
        * `LOCKER_OPENED` - LOCKER_OPENED
        * `ITEM_DETECTED` - ITEM_DETECTED
        * `ITEM_REMOVED` - ITEM_REMOVED
        * `COMMAND_FAILED` - COMMAND_FAILED
